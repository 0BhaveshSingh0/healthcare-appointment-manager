services:
  db:
    image: postgres:15-alpine
    container_name: healthcare-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare_appointments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare_appointments"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
